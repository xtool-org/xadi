name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: minor
        options:
          - major
          - minor
          - patch
          - custom
      custom_version:
        description: Explicit version (if custom)
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      source_tag: ${{ steps.version.outputs.source_tag }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          set -euo pipefail

          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          stable_semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ "$BUMP" == custom ]]; then
            if [[ -z "$CUSTOM_VERSION" ]]; then
              echo "custom_version is required when Version bump is custom" >&2
              exit 1
            fi
            version="$CUSTOM_VERSION"
          else
            if [[ -n "$CUSTOM_VERSION" ]]; then
              echo "custom_version must be empty for a $BUMP version bump" >&2
              exit 1
            fi

            latest_version="$({
              while IFS= read -r tag; do
                candidate="${tag#v}"
                if [[ "$candidate" =~ $stable_semver ]]; then
                  echo "$candidate"
                fi
              done < <(git tag --list 'v*')
            } | sort -V | tail -n 1)"
            latest_version="${latest_version:-0.0.0}"
            IFS=. read -r major minor patch <<< "$latest_version"

            case "$BUMP" in
              major) version="$((10#$major + 1)).0.0" ;;
              minor) version="$major.$((10#$minor + 1)).0" ;;
              patch) version="$major.$minor.$((10#$patch + 1))" ;;
              *) echo "unsupported version bump: $BUMP" >&2; exit 1 ;;
            esac
          fi

          if [[ ! "$version" =~ $semver ]]; then
            echo "version must be semantic and must not include a leading v" >&2
            exit 1
          fi

          echo "Resolved version: $version"

          source_tag="source-$version"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$source_tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$source_tag:refs/tags/$source_tag"
            tagged_commit="$(git rev-parse "$source_tag^{commit}")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "tag $source_tag points to $tagged_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_tag=$source_tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install LDC and DUB
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc

      - name: Build and test
        run: |
          set -euo pipefail
          make test

      - name: Pack architecture slice
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          tar -C out/XADIBinary.artifactbundle -czf "$RUNNER_TEMP/$TRIPLE.tar.gz" "$TRIPLE"

      - uses: actions/upload-artifact@v5
        with:
          name: slice-${{ matrix.triple }}
          path: ${{ runner.temp }}/${{ matrix.triple }}.tar.gz
          if-no-files-found: error

  build-macos:
    needs: validate
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install LDC and DUB
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc

      - name: Build and test
        run: |
          set -euo pipefail
          make test

      - name: Pack macOS slices
        run: |
          set -euo pipefail
          tar -C out/XADIBinary.artifactbundle -czf "$RUNNER_TEMP/macos.tar.gz" \
            arm64-apple-macosx \
            x86_64-apple-macosx

      - uses: actions/upload-artifact@v5
        with:
          name: slice-macos
          path: ${{ runner.temp }}/macos.tar.gz
          if-no-files-found: error

  release:
    needs:
      - validate
      - build-linux
      - build-macos
    runs-on: ubuntu-24.04
    env:
      ARCHIVE: XADIBinary.artifactbundle.zip
      BUNDLE: out/XADIBinary.artifactbundle
      SOURCE_TAG: ${{ needs.validate.outputs.source_tag }}
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: slice-*
          path: ${{ runner.temp }}/xadi-slices
          merge-multiple: true

      - name: Assemble and test artifact bundle
        run: |
          set -euo pipefail

          mkdir -p "$BUNDLE/include"
          for archive in "$RUNNER_TEMP"/xadi-slices/*.tar.gz; do
            tar -xzf "$archive" -C "$BUNDLE"
          done

          cp Sources/XADI/include/XADI.h "$BUNDLE/include/XADI.h"
          cp ArtifactBundle/module.modulemap "$BUNDLE/include/module.modulemap"
          ./ArtifactBundle/update-info.sh "$BUNDLE" "$VERSION"

          test -f "$BUNDLE/arm64-apple-macosx/libxadibase.a"
          test -f "$BUNDLE/x86_64-apple-macosx/libxadibase.a"
          test -f "$BUNDLE/aarch64-unknown-linux-gnu/libxadibase.a"
          test -f "$BUNDLE/x86_64-unknown-linux-gnu/libxadibase.a"
          make test-without-building

      - name: Archive artifact bundle
        id: archive
        run: |
          set -euo pipefail

          pushd out >/dev/null
          zip -qry "$RUNNER_TEMP/$ARCHIVE" XADIBinary.artifactbundle
          popd >/dev/null

          checksum="$(swift package compute-checksum "$RUNNER_TEMP/$ARCHIVE")"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Tag source and create GitHub release
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$SOURCE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
            tagged_commit="$(git rev-parse "$SOURCE_TAG^{commit}")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "tag $SOURCE_TAG points to $tagged_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field ref="refs/tags/$SOURCE_TAG" \
              --raw-field sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$SOURCE_TAG" >/dev/null 2>&1; then
            gh release upload "$SOURCE_TAG" \
              "$RUNNER_TEMP/$ARCHIVE#$ARCHIVE" \
              --clobber
          else
            gh release create "$SOURCE_TAG" \
              "$RUNNER_TEMP/$ARCHIVE#$ARCHIVE" \
              --verify-tag \
              --title "v$VERSION" \
              --generate-notes
          fi

      - name: Commit release manifest and tag version
        env:
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
        run: |
          set -euo pipefail

          source_commit="$GITHUB_SHA"

          artifact_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$SOURCE_TAG/$ARCHIVE"
          awk -v url="$artifact_url" -v checksum="$CHECKSUM" '
            /path: "out\/XADIBinary\.artifactbundle"/ {
              match($0, /^[[:space:]]*/)
              indent = substr($0, RSTART, RLENGTH)
              print indent "url: \"" url "\","
              print indent "checksum: \"" checksum "\""
              replaced = 1
              next
            }
            { print }
            END { if (!replaced) exit 1 }
          ' Package.swift > "$RUNNER_TEMP/Package.swift"
          mv "$RUNNER_TEMP/Package.swift" Package.swift

          package_content="$(base64 < Package.swift | tr -d '\n')"
          package_blob="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" \
              --raw-field content="$package_content" \
              --raw-field encoding=base64 \
              --jq .sha
          )"
          source_tree="$(
            gh api "repos/$GITHUB_REPOSITORY/git/commits/$source_commit" \
              --jq .tree.sha
          )"
          release_tree="$(
            jq -n \
              --arg base_tree "$source_tree" \
              --arg blob "$package_blob" \
              '{
                base_tree: $base_tree,
                tree: [{
                  path: "Package.swift",
                  mode: "100644",
                  type: "blob",
                  sha: $blob
                }]
              }' | gh api --method POST \
                "repos/$GITHUB_REPOSITORY/git/trees" \
                --input - \
                --jq .sha
          )"
          release_commit="$(
            jq -n \
              --arg message "Release $VERSION" \
              --arg tree "$release_tree" \
              --arg parent "$source_commit" \
              '{message: $message, tree: $tree, parents: [$parent]}' |
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/git/commits" \
                --input - \
                --jq .sha
          )"

          # GitHub's refs API can publish commits containing workflow files
          # with the default Actions token. Publish the branch first so the
          # version tag is never visible before its manifest is available.
          if git ls-remote --exit-code --heads origin refs/heads/release >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/heads/release" \
              --raw-field sha="$release_commit" \
              --field force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field ref=refs/heads/release \
              --raw-field sha="$release_commit" >/dev/null
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --raw-field ref="refs/tags/$TAG" \
            --raw-field sha="$release_commit" >/dev/null
